<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario de fuerza</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1016" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: una columna de 640px; cada ejercicio es una tarjeta con su tabla de series (Serie · Anterior · Kg · Reps · ✓);
   barra de descanso y navegación fijas abajo, al alcance del pulgar */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F4F6FA; --text:#141922; --muted:#5A6474; --line:#D7DDE7;
  --accent:#2647B5; --accent-soft:rgba(38,71,181,.10); --on-accent:#FFFFFF;
  --done:#1B8A57; --done-soft:rgba(27,138,87,.12); --on-done:#FFFFFF;
  --gold:#8A6400; --gold-soft:rgba(232,180,0,.22); --danger:#C0352B;
  --mus:#C3CCDA; --mus-n:#DEE3EB;
  --display:'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --nav-h:62px; --rest-h:76px; --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1016; --surface:#161A22; --surface-2:#1E232D; --text:#E9ECF2; --muted:#959EAE; --line:#2B313C;
    --accent:#88A3FF; --accent-soft:rgba(136,163,255,.15); --on-accent:#0B1020;
    --done:#45CF8C; --done-soft:rgba(69,207,140,.15); --on-done:#06140C;
    --gold:#F2C94C; --gold-soft:rgba(242,201,76,.18); --danger:#FF7A6E;
    --mus:#363E4C; --mus-n:#252A34;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1016; --surface:#161A22; --surface-2:#1E232D; --text:#E9ECF2; --muted:#959EAE; --line:#2B313C;
  --accent:#88A3FF; --accent-soft:rgba(136,163,255,.15); --on-accent:#0B1020;
  --done:#45CF8C; --done-soft:rgba(69,207,140,.15); --on-done:#06140C;
  --gold:#F2C94C; --gold-soft:rgba(242,201,76,.18); --danger:#FF7A6E;
  --mus:#363E4C; --mus-n:#252A34;
  color-scheme:dark;
}
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--body); font-size:16px; line-height:1.45;
  padding-top:env(safe-area-inset-top, 0px);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,p{ margin:0; }
h1,h2{ text-wrap:balance; }
button{ font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
input, textarea, select{ font:inherit; color:var(--text); background:var(--surface-2); border:1.5px solid var(--line); border-radius:10px; padding:8px 10px; min-height:44px; }
textarea{ width:100%; resize:vertical; min-height:72px; }
select{ width:100%; }
input::placeholder, textarea::placeholder{ color:var(--muted); opacity:.8; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

.app{ max-width:640px; margin:0 auto; padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:14px; }
body.resting .app{ padding-bottom:calc(var(--nav-h) + var(--rest-h) + 28px + env(safe-area-inset-bottom, 0px)); }

/* Cabecera */
.top{ display:flex; flex-direction:column; gap:4px; padding-top:6px; }
.eyebrow{ font-size:12.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
h1{ font-family:var(--display); font-weight:700; font-size:38px; line-height:1; letter-spacing:.005em; text-transform:uppercase; }
.meta{ color:var(--muted); font-size:14.5px; }
.notice{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; margin-top:8px; padding:10px 12px; border-radius:12px; background:var(--accent-soft); font-size:14.5px; }
.notice.warn{ background:var(--gold-soft); }
.notice .btn-text{ padding:0; min-height:32px; }

/* Piezas comunes */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px; display:flex; flex-direction:column; gap:10px; min-width:0; }
.section-title{ font-family:var(--display); font-weight:700; font-size:24px; line-height:1.1; text-transform:uppercase; margin-top:10px; }
.lab{ font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.muted{ color:var(--muted); }
.small{ font-size:14px; }
.empty{ color:var(--muted); padding:28px 4px; text-align:center; }
.btn-primary{ width:100%; min-height:56px; border:0; border-radius:14px; background:var(--accent); color:var(--on-accent); font-weight:700; font-size:18px; }
.btn-primary[disabled]{ opacity:.55; cursor:default; }
.btn-soft{ min-height:44px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface-2); padding:8px 14px; font-weight:700; }
.btn-outline{ min-height:40px; border:1.5px solid var(--accent); border-radius:10px; background:transparent; color:var(--accent); padding:6px 12px; font-weight:700; font-size:15px; white-space:nowrap; }
.switch{ display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:48px; padding:6px 0; background:none; border:0; color:var(--text); font-weight:700; text-align:left; }
.switch .track{ flex:none; position:relative; width:48px; height:28px; border-radius:14px; background:var(--line); transition:background .15s; }
.switch .track::after{ content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.3); transition:transform .15s; }
.switch[aria-checked="true"] .track{ background:var(--accent); }
.switch[aria-checked="true"] .track::after{ transform:translateX(20px); }
.btn-text{ background:none; border:0; padding:8px 2px; min-height:40px; color:var(--accent); font-weight:700; font-size:15px; }
.btn-text.muted{ color:var(--muted); font-weight:400; }
.btn-text.danger{ color:var(--danger); }
.pill{ min-height:40px; border:1.5px solid var(--line); border-radius:999px; background:var(--surface); padding:6px 14px; font-size:15px; }
.pill[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700; }
.pill[disabled]{ opacity:.55; cursor:default; }
.row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.row.between{ justify-content:space-between; }

/* Elegir sesión */
.sessions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sess{ display:flex; align-items:center; gap:10px; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:10px 12px; min-height:64px; }
.sess[aria-pressed="true"]{ border:2px solid var(--accent); background:var(--accent-soft); }
.sessions.three{ grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
.sessions.three .sess{ flex-direction:column; align-items:flex-start; gap:4px; padding:10px; }
.sessions.three .sess-k{ width:auto; font-size:30px; }
.sess-k{ font-family:var(--display); font-weight:700; font-size:34px; line-height:1; color:var(--accent); width:24px; text-align:center; }
.sess-t{ display:flex; flex-direction:column; min-width:0; }
.sess-t b{ font-size:14.5px; line-height:1.25; }
.sess-t small{ font-size:12.5px; color:var(--muted); min-height:1.2em; }
.sess-t small.today{ color:var(--done); font-weight:700; }

/* Estado de la sesión en curso */
.status{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:6px 12px; background:var(--bg); padding:10px 0 8px; }
.status .clock{ display:flex; align-items:center; gap:6px; font-family:var(--display); font-weight:700; font-size:24px; font-variant-numeric:tabular-nums; }
.status .clock svg{ width:20px; height:20px; color:var(--accent); }
.status .count{ justify-self:end; font-size:14.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.status .bar{ grid-column:1 / -1; height:6px; border-radius:6px; background:var(--line); overflow:hidden; }
.status .bar i{ display:block; height:100%; background:var(--done); border-radius:6px; transition:width .3s; }
.status.idle{ display:block; color:var(--muted); font-size:14.5px; position:static; padding:2px 0; }
.presets{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }

/* Tarjeta de ejercicio */
.ex-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.ex-top h3{ font-size:17.5px; line-height:1.25; min-width:0; }
.tag{ flex-shrink:0; font-family:var(--display); font-weight:700; font-size:18px; line-height:1; padding:6px 9px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); font-variant-numeric:tabular-nums; }
.ex.is-done .tag{ background:var(--done-soft); border-color:var(--done); color:var(--done); }
.ex-note{ color:var(--muted); font-size:14px; margin-top:-4px; }
.sug{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:8px 10px; border-radius:10px; background:var(--gold-soft); font-size:15px; }
.sug span{ flex:1 1 180px; }
.ex.is-skipped h3{ color:var(--muted); text-decoration:line-through; }

/* Tabla de series */
.sets{ display:grid; gap:6px; }
.srow, .shead{ display:grid; grid-template-columns:28px minmax(0, 1fr) 64px 64px 46px; gap:6px; align-items:center; }
.sets.nw .srow, .sets.nw .shead{ grid-template-columns:28px minmax(0, 1fr) 76px 46px; }
.shead span{ font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:center; }
.shead span:first-child{ text-align:left; }
.srow{ border-radius:10px; padding:2px 0; }
.srow.done{ background:var(--done-soft); }
.snum{ font-family:var(--display); font-weight:700; font-size:22px; text-align:center; color:var(--muted); }
.srow.done .snum{ color:var(--done); }
.prev{ background:none; border:0; padding:4px; min-height:44px; color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; text-align:center; text-decoration:underline dotted; text-underline-offset:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.prev.none{ display:flex; align-items:center; justify-content:center; text-decoration:none; }
.cell{ width:100%; min-width:0; text-align:center; font-family:var(--display); font-weight:700; font-size:22px; padding:6px 2px; font-variant-numeric:tabular-nums; }
.cell::placeholder{ font-weight:600; }
.srow.done .cell{ background:transparent; border-color:transparent; }
.check{ width:46px; height:44px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--muted); display:grid; place-items:center; }
.check svg{ width:22px; height:22px; }
.check[aria-pressed="true"]{ background:var(--done); border-color:var(--done); color:var(--on-done); }
.ex-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; }
.ex-foot{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding-top:8px; border-top:1px solid var(--line); }
.chips{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
.chip{ min-height:40px; border:1.5px solid var(--line); border-radius:999px; background:var(--surface); padding:6px 14px; font-size:15px; }
.chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700; }
.chip-duro[aria-pressed="true"]{ background:var(--danger); border-color:var(--danger); color:var(--on-accent); }

/* Historial */
.hist-top{ display:flex; align-items:center; gap:12px; }
.badge-k{ flex-shrink:0; width:40px; height:40px; border-radius:10px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); font-family:var(--display); font-weight:700; font-size:24px; }
.hist-top h3{ font-size:17px; }
.hist-top h3::first-letter{ text-transform:uppercase; }
.hist-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.hist-list li{ display:flex; flex-direction:column; min-width:0; }
.h-name{ font-weight:700; font-size:15px; }
.h-val{ font-size:15px; font-variant-numeric:tabular-nums; }
.rec{ align-self:flex-start; margin-top:3px; font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--gold-soft); color:var(--gold); }

/* Progreso */
.stats{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.stat{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:2px; }
.stat b{ font-family:var(--display); font-size:30px; line-height:1; font-variant-numeric:tabular-nums; }
.stat small{ font-size:12.5px; color:var(--muted); line-height:1.25; }
.big{ font-family:var(--display); font-weight:700; font-size:24px; line-height:1.15; }
.chart-wrap{ overflow-x:auto; }
.chart{ display:block; max-width:100%; height:auto; }
.c-grid{ stroke:var(--line); stroke-width:1; }
.c-tick, .c-unit{ fill:var(--muted); font-size:12.5px; font-family:var(--body); }
.c-area{ fill:var(--accent-soft); stroke:none; }
.c-line{ fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
.c-dot{ fill:var(--surface); stroke:var(--accent); stroke-width:2.25; }
.c-end{ fill:var(--accent); stroke:var(--surface); stroke-width:2; }
.c-lab{ fill:var(--text); font-size:12.5px; font-family:var(--body); font-weight:700; }

/* Pruebas */
.cps{ display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; }
.cp{ min-height:56px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:4px; }
.cp[aria-pressed="true"]{ border:2px solid var(--accent); background:var(--accent-soft); }
.cp b{ font-family:var(--display); font-size:20px; line-height:1; }
.cp small{ font-size:12px; color:var(--done); font-weight:700; min-height:1.2em; }
.trow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); }
.trow:last-child{ border-bottom:0; }
.trow > span:first-child{ font-size:15px; min-width:0; }
.tin{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
.tin input{ width:76px; }
.tblock{ padding:4px 0 10px; border-bottom:1px solid var(--line); }
.tblock:last-child{ border-bottom:0; }
.tblock .trow{ border-bottom:0; }
.tnote{ width:100%; font-size:14.5px; }
.tprev{ margin:4px 2px 0; font-size:13px; color:var(--muted); }
.cmp-notes{ list-style:none; margin:6px 0 0; padding:0; font-size:13px; color:var(--muted); }
.cmp-notes b{ color:var(--text); font-weight:700; }
.unit{ color:var(--muted); font-size:14px; min-width:2.2em; }
.cmp-name{ font-weight:700; font-size:14.5px; }
.cmp-cells{ display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin-top:6px; }
.cell-cmp{ display:flex; flex-direction:column; align-items:center; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:4px 2px; }
.cell-cmp small{ color:var(--muted); font-size:12px; }
.cell-cmp b{ font-variant-numeric:tabular-nums; font-size:16px; }
.cell-cmp.up{ border-color:var(--done); background:var(--done-soft); }

/* Plan */
.phases{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.phases li{ display:grid; grid-template-columns:32px 1fr; gap:2px 10px; padding:10px 0; border-bottom:1px solid var(--line); }
.phases li:last-child{ border-bottom:0; }
.ph-n{ grid-row:span 2; font-family:var(--display); font-weight:700; font-size:28px; line-height:1; color:var(--muted); }
.phases li.now .ph-n{ color:var(--accent); }
.ph-name{ font-weight:700; }
.ph-meta{ color:var(--muted); font-size:14px; }
.now-tag{ margin-left:6px; font-size:12px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--accent); color:var(--on-accent); }
.guide{ margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:15px; }
.erow{ display:flex; flex-direction:column; gap:8px; padding:12px 0; border-bottom:1px solid var(--line); }
.erow:last-of-type{ border-bottom:0; }
.erow > input{ width:100%; }
.egrid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(92px, 1fr)); gap:8px; }
.egrid label{ display:flex; flex-direction:column; gap:3px; font-size:13px; color:var(--muted); }
.egrid input, .egrid select{ width:100%; }

/* Barra de descanso */
.restbar{ position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index:19; background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -6px 18px rgba(0,0,0,.08); }
.rest-fill{ height:4px; background:var(--accent); transition:width .25s linear; }
.restbar.done .rest-fill{ background:var(--done); }
.rest-in{ max-width:640px; margin:0 auto; min-height:calc(var(--rest-h) - 4px); display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.rest-txt{ display:flex; flex-direction:column; }
.rest-count{ font-family:var(--display); font-weight:700; font-size:36px; line-height:1; font-variant-numeric:tabular-nums; }
.restbar.done .rest-count{ color:var(--done); font-size:26px; animation:blink 1s steps(2) 3; }
.rest-btns{ display:flex; gap:6px; }
.rest-btns button{ min-height:44px; min-width:52px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); font-weight:700; font-size:14.5px; padding:4px 8px; }
@keyframes blink{ 50%{ opacity:.3; } }

/* Navegación */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom, 0px);
  padding-left:env(safe-area-inset-left, 0px); padding-right:env(safe-area-inset-right, 0px); }
.nav-in{ display:flex; max-width:640px; margin:0 auto; }
.nav button{ flex:1; min-height:var(--nav-h); background:none; border:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:12.5px; color:var(--muted); padding:0 2px; }
.nav svg{ width:24px; height:24px; }
.nav button[aria-current="page"]{ color:var(--accent); font-weight:700; }
.nav button[aria-current="page"] svg{ stroke-width:2.4; }

.toast{ position:fixed; left:50%; bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); transform:translate(-50%, 12px); z-index:50; background:var(--text); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:15px; max-width:calc(100% - 32px); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
body.resting .toast{ bottom:calc(var(--nav-h) + var(--rest-h) + 16px + env(safe-area-inset-bottom, 0px)); }
.toast.show{ opacity:1; transform:translate(-50%, 0); }

/* Biblioteca: selector por músculo y ficha del ejercicio, en hojas a pantalla completa */
body.sheet-open{ overflow:hidden; }
body.sheet-open .toast{ bottom:calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet{ position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto; overscroll-behavior:contain;
  padding:env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet.fx{ z-index:45; }
.sheet-in{ max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
.sheet-head{ position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bg); padding:8px 0 4px; }
.sheet-head .section-title{ margin:0; }
.pk-q{ width:100%; }
.maps{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.maps figure{ margin:0; display:flex; flex-direction:column; align-items:center; gap:2px; }
.maps figcaption{ font-size:12.5px; color:var(--muted); }
.body{ display:block; width:100%; max-width:170px; height:auto; }
.maps.sm .body{ max-width:110px; }
.bn{ fill:var(--mus-n); }
.bm{ fill:var(--mus); stroke:var(--bg); stroke-width:1; }
.body.tap .bm{ cursor:pointer; }
.bm.on{ fill:var(--accent); }

const caps = {};
function getCap(name){
  if (!(window.claude && typeof window.claude.use === 'function')) return Promise.resolve(null);
  if (!caps[name]) caps[name] = Promise.resolve(window.claude.use(name)).catch(() => null);
  return caps[name];
}

/* ---------- Almacenamiento: db de Claude o, si no hay, este navegador ---------- */
const store = {
  mode:'loading', refs:null,
  async init(){
    let db = null, user = null, uid = null;
    try { [db, user] = await Promise.all([getCap('db'), getCap('user')]); } catch (e) {}
    if (db && user) { try { uid = await user.id(); } catch (e) {} }
    if (db && uid) {
      this.mode = 'db';
      const base = 'data/users/' + uid;
      const cfg = db.doc(base + '/config');
      this.refs = { cfg, sessions: cfg.collection('sessions'), tests: db.doc(base + '/tests'), notes: db.doc(base + '/notes'), gear: db.doc(base + '/gear') };
      this.refs.sessions.onSnapshot(snap => {
        S.sessions = snap.docs.map(d => Object.assign({ id: d.id }, clone(d.data() || {})));
        S.loaded.sessions = true; render();
      }, err => dbFail(err));
      cfg.onSnapshot(snap => {
        const d = snap.exists ? snap.data() : null;
        if (d && d.templates && d.templates.A && d.templates.B) S.templates = clone(d.templates);
        S.phasesApplied = d && Array.isArray(d.phasesApplied) ? d.phasesApplied.slice() : [];
        S.prevCfg = d && d.prev && d.prev.templates ? clone(d.prev) : null;
        S.loaded.cfg = true; render();
      }, err => dbFail(err));
      this.refs.notes.onSnapshot(snap => {
        const d = snap.exists ? snap.data() : null;
        S.exNotes = d && d.values ? clone(d.values) : {};
        render();
      }, err => dbFail(err));
      this.refs.tests.onSnapshot(snap => {
        const d = snap.exists ? snap.data() : null;
        S.tests = d && d.values ? clone(d.values) : {};
        render();
      }, err => dbFail(err));
      this.refs.gear.onSnapshot(snap => {
        const d = snap.exists ? snap.data() : null;
        S.gear = d && d.values ? clone(d.values) : clone(DEFAULT_GEAR);
        render();
      }, err => dbFail(err));
      setTimeout(() => { if (!S.loaded.sessions || !S.loaded.cfg) { S.loaded.sessions = S.loaded.cfg = true; S.dbError = 'Los datos tardan en cargar. Revisa la conexión y vuelve a abrir el diario.'; render(); } }, 12000);
    } else {
      this.mode = 'local';
      S.sessions = LS.get('sessions', []);
      const c = LS.get('config', null);
      if (c && c.templates && c.templates.A && c.templates.B) { S.templates = c.templates; S.phasesApplied = c.phasesApplied || []; S.prevCfg = c.prev || null; }
      else { const t = LS.get('templates', null); if (t && t.A && t.B) S.templates = t; }
      S.tests = LS.get('tests', {});
      S.exNotes = LS.get('exNotes', {}) || {};
      S.gear = LS.get('gear', null) || clone(DEFAULT_GEAR);
      S.loaded.sessions = S.loaded.cfg = true;
      render();
    }
  },
  async retry(fn){
    try { return await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 500 + Math.random() * 900)); return await fn(); }
      throw e;
    }
  },
  async addSession(rec){
    if (this.mode === 'db') { const ref = this.refs.sessions.doc(); await this.retry(() => ref.set(rec)); }
    else { const r = Object.assign({ id: newId() }, rec); const next = S.sessions.concat([r]); if (!LS.set('sessions', next)) throw { message:'no hay espacio en este navegador' }; S.sessions = next; }
  },
  async deleteSession(id){
    if (this.mode === 'db') { await this.retry(() => this.refs.sessions.doc(id).delete()); }
    else { S.sessions = S.sessions.filter(s => s.id !== id); LS.set('sessions', S.sessions); }
  },
  async saveConfig(cfg){
    const body = { templates: cfg.templates, phasesApplied: cfg.phasesApplied || [], prev: cfg.prev || null, updatedAt: Date.now() };
    if (this.mode === 'db') { await this.retry(() => this.refs.cfg.set(body)); }
    else { if (!LS.set('config', body)) throw { message:'no hay espacio en este navegador' }; }
    S.templates = clone(body.templates); S.phasesApplied = body.phasesApplied.slice(); S.prevCfg = body.prev ? clone(body.prev) : null;
  },
  async saveNotes(values){
    if (this.mode === 'db') { await this.retry(() => this.refs.notes.set({ values, updatedAt: Date.now() })); }
    else { if (!LS.set('exNotes', values)) throw { message:'no hay espacio en este navegador' }; }
    S.exNotes = clone(values);
  },
  async saveGear(values){
    if (this.mode === 'db') { await this.retry(() => this.refs.gear.set({ values, updatedAt: Date.now() })); }
    else { if (!LS.set('gear', values)) throw { message:'no hay espacio en este navegador' }; }
    S.gear = clone(values);
  },
  async saveTests(values){
    if (this.mode === 'db') { await this.retry(() => this.refs.tests.set({ values, updatedAt: Date.now() })); }
    else { if (!LS.set('tests', values)) throw { message:'no hay espacio en este navegador' }; }
    S.tests = clone(values);
  }
};
function dbFail(err){

const byDateAsc = (a, b) => a.date === b.date ? (a.createdAt || 0) - (b.createdAt || 0) : (a.date < b.date ? -1 : 1);
const sortedAsc = () => S.sessions.slice().sort(byDateAsc);
const sortedDesc = () => sortedAsc().reverse();
function lastEntry(id){
  for (const s of sortedDesc()) {
    const it = (s.items || []).find(x => x.id === id);
    if (it) return { date: s.date, item: it };
  }
  return null;
}
function nextSessionKey(){
  const last = sortedDesc().find(s => s.session === 'A' || s.session === 'B');
  return last && last.session === 'A' ? 'B' : 'A';
}
function weekStart(iso){ const d = parseISO(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoOf(d); }
function weekCount(){ const t = todayISO(), w = weekStart(t); return S.sessions.filter(s => s.date >= w && s.date <= t).length; }
function streak(){
  const c = {}; for (const s of S.sessions) { const k = weekStart(s.date); c[k] = (c[k] || 0) + 1; }
  let w = weekStart(todayISO()); if ((c[w] || 0) < 2) w = addDays(w, -7);
  let n = 0; while ((c[w] || 0) >= 2) { n++; w = addDays(w, -7); }
  return n;
}
const phaseFor = iso => PHASES.find(p => iso <= p.end) || null;
const hasTest = id => !!(S.tests[id] && S.tests[id].vals && Object.keys(S.tests[id].vals).length);
function upcomingCp(){ const t = todayISO(); return CHECKPOINTS.find(c => !hasTest(c.id) && addDays(c.date, 10) >= t) || null; }
function computeRecords(){
  const best = {}, out = {};
  for (const s of sortedAsc()) {
    for (const it of (s.items || [])) {
      const w = it.weight || 0, top = topAtW(it);
      const b = best[it.id]; let r = null;
      if (b) {
        if (w > b.w) r = 'peso';
        else if (w === b.w && top > b.top) r = it.kind === 'time' ? 'tiempo' : 'reps';
        if (w > b.w) { b.w = w; b.top = top; } else if (w === b.w && top > b.top) b.top = top;
      } else best[it.id] = { w, top };
      if (r) (out[s.id] = out[s.id] || {})[it.id] = r;
    }
  }
  return out;
}
/* Peso por serie: it.weights solo existe si cambió entre series; it.weight es el más alto */
const setWeights = it => (it.sets || []).map((_, s) => Array.isArray(it.weights) && it.weights[s] !== undefined ? it.weights[s] : it.weight);
const mixedW = it => Array.isArray(it.weights) && it.weights.some(w => w !== it.weights[0]);
const minW = it => Math.min(...setWeights(it).filter(w => w != null));
const topAtW = it => { const ws = setWeights(it); return Math.max(0, ...(it.sets || []).filter((_, s) => ws[s] === it.weight)); };
function entryText(it){
  const u = it.kind === 'time' ? ' s' : ' reps';
  if (mixedW(it)) {
    const ws = setWeights(it), groups = [];
    (it.sets || []).forEach((r, s) => { const g = groups[groups.length - 1]; if (g && g.w === ws[s]) g.r.push(r); else groups.push({ w: ws[s], r: [r] }); });
    const e2 = it.effort ? ' (' + EFF[it.effort] + ')' : '';
    return groups.map(g => fmtW(g.w) + ': ' + g.r.map(fmtNum).join(', ')).join(' · ') + u + e2;
  }
  const w = it.weight == null ? '' : (it.weight === 0 ? 'peso corporal: ' : fmtNum(it.weight) + ' kg: ');
  const e = it.effort ? ' (' + EFF[it.effort] + ')' : '';
  return w + (it.sets || []).map(fmtNum).join(', ') + u + e;
}
/* ---------- Material de casa: pesos que existen de verdad ---------- */
/* Material de casa. Mancuernas: barra de 2 kg + discos de 1 y 2 kg, iguales a cada lado (2, 4, 6 u 8 kg con las dos).
   Una kettlebell de 5 kg. Polea: se carga con discos, uno de cada */
const DEFAULT_GEAR = { mancuernas:[2, 4, 6, 8], kettlebell:[5], polea:[0.5, 1.25, 2.5, 5, 10, 15, 20] };
/* [material, nombre, ayuda, discos]. Con discos se apuntan los discos y los pesos posibles son sus sumas */
const GEAR = [['mancuernas', 'Mancuernas', 'kg de cada mancuerna'], ['kettlebell', 'Kettlebell', 'kg de cada kettlebell'],
  ['polea', 'Polea', 'discos que tenéis', true]];
const isDiscs = eq => !!(GEAR.find(g => g[0] === eq) || [])[3];
function discSums(discs){
  let sums = new Set([0]);
  for (const d of discs) { const next = new Set(sums); for (const x of sums) { const v = Math.round((x + d) * 100) / 100; if (v <= 200) next.add(v); } sums = next; }
  sums.delete(0); return Array.from(sums).sort((a, b) => a - b);
}
const eqOf = id => (LIB.get(id) || {}).eq || null;
const gearRaw = eq => (Array.isArray(S.gear[eq]) ? S.gear[eq] : []);
const gearList = eq => isDiscs(eq) ? discSums(gearRaw(eq)) : gearRaw(eq);
/* "1 2 2,5 3" o "2; 4; 6" o "2,4,6". La coma sola es decimal ("2,5") */
function parseGear(txt, keepDup){
  const out = [];
  for (const tok of String(txt || '').split(/[\s;]+/)) {
    if (!tok) continue;
    const parts = (tok.match(/,/g) || []).length > 1 ? tok.split(',') : [tok];
    for (const p of parts) { const n = num(p.replace(/kg$/i, '')); if (n != null && n > 0 && n <= 200) out.push(Math.round(n * 100) / 100); }
  }
  return (keepDup ? out : Array.from(new Set(out))).sort((a, b) => a - b);
}
const gearText = l => l.map(fmtNum).join('  ');
/* Siguiente peso para subir: el menor de la lista que suba al menos el salto del ejercicio (o el más alto que haya).
   undefined si no hay lista; null si ya está en el máximo */
function nextGear(id, w, step){
  const l = gearList(eqOf(id)); if (!l.length) return undefined;
  const up = l.filter(g => g > w + 1e-9); if (!up.length) return null;
  const ok = up.find(g => g >= w + (step || 0) - 1e-9);
  return ok !== undefined ? ok : up[up.length - 1];
}
function suggest(it, last){
  const u = it.kind === 'time' ? 's' : 'reps';
  if (!last) {
    const w = num(it.weight);
    if (w == null) return { text:'Busca un peso con el que haga ' + it.min + ' ' + u + ' "justo"', weight:null };
    if (w === 0) return { text:'Primer día: técnica limpia y sin prisa', weight:null };
    return { text:'Empieza con ' + fmtW(w) + ' y técnica limpia', weight:null };
  }
  if (it.id === 'saltos_cajon') return { text:'Calidad antes que cantidad: saltos limpios y caída suave', weight:null };
  const L = last.item, w = L.weight, sets = L.sets || [];
  if (mixedW(L)) {
    const lo = minW(L);
    if ((L.effort || 'justo') === 'duro') return { text:'La última vez bajó a ' + fmtW(lo) + '. Hoy todas las series con ' + fmtW(lo), weight: lo };
    return { text:'La última vez bajó de ' + fmtW(w) + ' a ' + fmtW(lo) + '. Intenta mantener ' + fmtW(w) + ' en todas', weight: w };
  }
  const allTop = sets.length >= it.n && sets.every(v => v >= it.max);
  const eff = L.effort || 'justo', step = Number(it.step) || 0;
  if (allTop && eff !== 'duro') {
    if (w && w > 0 && step > 0) {
      const g = nextGear(it.id, w, step);
      if (g === null) return { text:'Ya está en el peso más alto que tenéis: suma reps o pasa a una versión más difícil', weight:w };
      const nw = g !== undefined ? g : Math.round((w + step) * 10) / 10;
      return { text:'Sube a ' + fmtW(nw), weight:nw };
    }
    if (it.id === 'flex_barra' || it.id === 'remo_inv') return { text:'Baja la barra un agujero', weight:null };
    if (it.id === 'bajadas') return { text:'Prueba su primera dominada', weight:null };
    if (it.kind === 'time') return { text:'Intenta ' + (it.max + 5) + ' s o más', weight:null };
    return { text: step > 0 ? 'Prueba a añadir algo de peso' : 'Suma repeticiones o pasa a una versión más difícil', weight:null };
  }
  if (eff === 'duro') return { text: w ? 'Repite ' + fmtW(w) + ' hasta que salga "justo"' : 'Repite hasta que salga "justo"', weight: w == null ? null : w };
  if (it.kind === 'time') return { text: w ? 'Repite ' + fmtW(w) + ' y suma unos segundos' : 'Suma unos segundos', weight: w == null ? null : w };
  return { text: w ? 'Repite ' + fmtW(w) + ' y suma una rep' : 'Suma una rep', weight: w == null ? null : w };
}

/* ---------- Temporizador de descanso ---------- */
let timerEnd = 0, timerTotal = 90, timerId = null, audioCtx = null, wakeLock = null;

}

  try {
    unlockAudio();
    [0, 0.35, 0.7].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), at = audioCtx.currentTime + t;
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.4, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.25);
      o.start(at); o.stop(at + 0.26);
    });
  } catch (e) {}
}

  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

  if (!bar) return;

  if (!timerEnd) return;
  const left = timerLeft(), done = left === 0;
  bar.classList.toggle('done', done);
  document.getElementById('rest-count').textContent = done ? '¡Siguiente serie!' : clockText(left * 1000);
  document.getElementById('rest-lab').textContent = done ? 'Descanso terminado' : 'Descanso';
  document.getElementById('rest-fill').style.width = (done ? 100 : Math.min(100, left / timerTotal * 100)) + '%';
}

    clearInterval(timerId); timerId = null;

function exerciseOptions(){

function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function chart(data, unit, label){
  const W = Math.max(290, Math.min(608, (root.clientWidth || 360) - 30)), H = 240, L = 40, R = 22, T = 34, B = 30;
  const ts = data.map(p => parseISO(p.date).getTime());
  let x0 = Math.min(...ts), x1 = Math.max(...ts); if (x1 === x0) { x0 -= 4 * 864e5; x1 += 4 * 864e5; }
  const ys = data.map(p => p.y), ymin = Math.min(...ys), ymax = Math.max(...ys);
  const step = niceStep(Math.max((ymax - ymin) / 4, unit === 'kg' ? 0.5 : 1));
  let lo = Math.max(0, Math.floor((ymin - step) / step) * step), hi = Math.ceil((ymax + step) / step) * step; if (hi <= lo) hi = lo + step;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" class="c-grid"/><text x="' + (L - 8) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end" class="c-tick">' + fmtNum(v) + '</text>';
  const pts = data.map((p, i) => X(ts[i]).toFixed(1) + ' ' + Y(p.y).toFixed(1));
  const path = 'M' + pts.join(' L');
  const area = data.length > 1 ? '<path d="' + path + ' L' + X(ts[ts.length - 1]).toFixed(1) + ' ' + Y(lo).toFixed(1) + ' L' + X(ts[0]).toFixed(1) + ' ' + Y(lo).toFixed(1) + ' Z" class="c-area"/>' : '';
  const showAll = data.length <= 6, lastI = data.length - 1;
  const anchor = i => i === 0 && data.length > 1 ? 'start' : i === lastI && data.length > 1 ? 'end' : 'middle';
  const dots = data.map((p, i) => {
    const cx = X(ts[i]).toFixed(1), cy = Y(p.y).toFixed(1);
    const lab = (showAll || i === lastI) && p.label ? '<text x="' + cx + '" y="' + (Y(p.y) - 12).toFixed(1) + '" text-anchor="' + anchor(i) + '" class="c-lab">' + esc(p.label) + '</text>' : '';
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (i === lastI ? 6 : 4.5) + '" class="' + (i === lastI ? 'c-end' : 'c-dot') + '"/>' + lab;
  }).join('');
  const idx = Array.from(new Set(data.length >= 3 ? [0, Math.floor(lastI / 2), lastI] : data.map((_, i) => i)));
  const xl = idx.map(i => '<text x="' + X(ts[i]).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + anchor(i) + '" class="c-tick">' + esc(fmtDate(data[i].date)) + '</text>').join('');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(label) + '">' + g + area +
    '<path d="' + path + '" class="c-line"/>' + dots + xl + '<text x="' + L + '" y="16" class="c-unit">' + esc(unit) + '</text></svg>';
}

async function saveSession(){
  const d = curDraft(), items = [];
  for (const it of d.items) {
    if (it.skip) continue;
    const sets = it.reps.map((v, s) => ({ r: num(v), w: num(it.setW[s]) })).filter(p => p.r != null && p.r >= 0);
    if (!sets.length) continue;
    const ws = sets.map(p => p.w), known = ws.filter(w => w != null);
    const rec = { id:it.id, name:it.name, kind:it.kind, weight: known.length ? Math.max(...known) : null, sets: sets.map(p => p.r), effort: it.effort || null };
    const dn = String(it.dnote || '').trim(); if (dn) rec.note = dn;
    if (ws.some(w => w !== ws[0])) rec.weights = ws;
    items.push(rec);
  }
  if (!items.length) { toast('Apunta al menos una serie para guardar la sesión'); return; }
  const rec = { date: d.date || todayISO(), session: d.session, items, note: String(d.note || '').trim(), createdAt: Date.now() };
  if (d.startedAt) { rec.startedAt = d.startedAt; rec.endedAt = Date.now(); }
  const before = computeRecords();
  S.saving = true; render();
  try {
    await store.addSession(rec);
    delete S.drafts[d.session]; saveDrafts();
    S.active = null; S.tab = 'history'; S.confirmDiscard = false; stopRest();
    const after = computeRecords();
    let n = 0; for (const id of Object.keys(after)) if (!before[id]) n += Object.keys(after[id]).length;
    const copied = await autoBackup();
    toast((n ? 'Sesión guardada. ¡' + n + (n === 1 ? ' récord' : ' récords') + ' hoy!' : 'Sesión guardada') + (copied ? ' Copia en Descargas.' : ''));
    window.scrollTo(0, 0);
  } catch (e) {
    toast('No se ha guardado: ' + ((e && e.message) || 'inténtalo de nuevo'));
  }
  S.saving = false; render();
}
async function deleteSession(id){
  try { await store.deleteSession(id); toast('Sesión borrada'); }
  catch (e) { toast('No se ha podido borrar: ' + ((e && e.message) || 'inténtalo de nuevo')); }
  render();
}

/* Descarga: con Claude usa su capacidad; fuera, un enlace normal */
async function saveFile(filename, data){
  const dl = await getCap('downloads');
  if (dl) return dl.save({ filename, data });
  const blob = data instanceof Blob ? data : new Blob([data], { type:'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

const shareFile = (json, base) => {
  for (const [ext, type] of [['json', 'application/json'], ['txt', 'text/plain']]) {
    const f = new File([json], base + '.' + ext, { type });
    try { if (navigator.canShare && navigator.canShare({ files:[f] })) return f; } catch (e) {}
  }
  return null;
};

}
function readImport(file){
  const r = new FileReader();
  r.onload = () => {
    let d = null; try { d = JSON.parse(r.result); } catch (e) {}
    if (!d || d.app !== 'diarioEric' || !Array.isArray(d.sessions)) { toast('Ese fichero no es una copia del diario'); return; }
    S.pendingImport = { exportedAt: String(d.exportedAt || todayISO()), data: d }; render();
  };
  r.onerror = () => toast('No se ha podido leer el fichero');
  r.readAsText(file);
}
async function importAction(){
  const d = S.pendingImport && S.pendingImport.data; if (!d) return;
  if (store.mode !== 'local') { toast('Recuperar copia solo funciona en la app instalada'); return; }
  const c = d.config || {};
  if (!LS.set('sessions', d.sessions)) { toast('No hay espacio en este móvil'); return; }
  S.sessions = d.sessions;
  if (c.templates && c.templates.A && c.templates.B) await store.saveConfig({ templates: c.templates, phasesApplied: c.phasesApplied || [], prev: c.prev || null });
  await store.saveTests(d.tests || {});
  await store.saveNotes(d.exNotes || {});
  if (d.gear) await store.saveGear(d.gear);
  S.pendingImport = null; S.edit = null; S.drafts = {}; saveDrafts();
  toast('Copia recuperada'); render();
}
let xlsxPromise = null;
function loadXlsx(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPromise) xlsxPromise = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('sin librería'));
    sc.onerror = () => { xlsxPromise = null; rej(new Error('sin conexión')); };
    document.head.appendChild(sc);
  });
  return xlsxPromise;
}
const excelDate = iso => { const p = String(iso).split('-').map(Number); return (Date.UTC(p[0], p[1] - 1, p[2]) - Date.UTC(1899, 11, 30)) / 864e5; };
function buildWorkbook(XLSX){
  const fmtDates = (ws, cells) => { for (const a of cells) { const c = ws[XLSX.utils.encode_cell(a)]; if (c && c.t === 'n') c.z = 'dd/mm/yyyy'; } };
  const recs = computeRecords(), asc = sortedAsc();
  let maxSets = 1; for (const s of asc) for (const it of (s.items || [])) maxSets = Math.max(maxSets, (it.sets || []).length);
  const head = ['Fecha', 'Sesión', 'Ejercicio', 'Peso (kg)'];
  for (let i = 1; i <= maxSets; i++) head.push('Serie ' + i);
  head.push('Peso por serie', 'Total', 'Unidad', 'Esfuerzo', 'Récord', 'Nota del ejercicio', 'Nota de la sesión');
  const rows = [head];
  for (const s of asc) for (const it of (s.items || [])) {
    const sets = it.sets || [], r = [excelDate(s.date), s.session, it.name, it.weight == null ? '' : it.weight];
    for (let i = 0; i < maxSets; i++) r.push(sets[i] == null ? '' : sets[i]);
    r.push(mixedW(it) ? setWeights(it).map(w => w == null ? '-' : fmtNum(w)).join(' / ') : '', sets.reduce((a, b) => a + b, 0), it.kind === 'time' ? 's' : 'reps', EFF[it.effort] || '', recs[s.id] && recs[s.id][it.id] ? 'Récord de ' + recs[s.id][it.id] : '', it.note || '', s.note || '');
    rows.push(r);
  }
  const ws1 = XLSX.utils.aoa_to_sheet(rows);
  fmtDates(ws1, rows.slice(1).map((_, i) => ({ r: i + 1, c: 0 })));
  ws1['!cols'] = head.map((h, i) => ({ wch: i === 0 ? 11 : i === 2 ? 34 : h === 'Nota de la sesión' || h === 'Nota del ejercicio' ? 40 : h === 'Récord' ? 16 : h === 'Peso por serie' ? 14 : 9 }));
  if (rows.length > 1) ws1['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{ r:0, c:0 }, e:{ r: rows.length - 1, c: head.length - 1 } }) };

  const sum = [['Ejercicio', 'Sesiones', 'Primera vez', 'Peso inicial (kg)', 'Última vez', 'Peso actual (kg)', 'Mejor serie', 'Unidad', 'Último esfuerzo']];
  for (const o of exerciseOptions().filter(o => o.count > 0)) {
    const pts = seriesFor(o.id), f = pts[0], l = pts[pts.length - 1];
    sum.push([o.name, pts.length, excelDate(f.date), f.item.weight == null ? '' : f.item.weight, excelDate(l.date), l.item.weight == null ? '' : l.item.weight, Math.max(...pts.map(p => p.top)), l.kind === 'time' ? 's' : 'reps', EFF[l.item.effort] || '']);
  }
  const ws2 = XLSX.utils.aoa_to_sheet(sum);
  fmtDates(ws2, sum.slice(1).flatMap((_, i) => [{ r: i + 1, c: 2 }, { r: i + 1, c: 4 }]));
  ws2['!cols'] = [{ wch:34 }, { wch:9 }, { wch:12 }, { wch:15 }, { wch:12 }, { wch:15 }, { wch:11 }, { wch:8 }, { wch:14 }];

  const tv = (c, f) => { const t = S.tests[c.id]; const v = t ? f(t) : null; return v == null ? '' : v; };
  const tp = [['Prueba'].concat(CHECKPOINTS.map(c => c.label)), ['Fecha'].concat(CHECKPOINTS.map(c => tv(c, t => t.date ? excelDate(t.date) : null)))];
  for (const t of TESTS) {
    tp.push([t.name + ' (' + t.unit + ')'].concat(CHECKPOINTS.map(c => tv(c, x => x.vals ? x.vals[t.id] : null))));
    if (CHECKPOINTS.some(c => S.tests[c.id] && S.tests[c.id].notes && S.tests[c.id].notes[t.id])) tp.push(['  Nota'].concat(CHECKPOINTS.map(c => tv(c, x => x.notes ? x.notes[t.id] : null))));
  }
  for (const w of WORKING) tp.push([w.name + ', peso de trabajo (kg)'].concat(CHECKPOINTS.map(c => tv(c, x => x.pesos ? x.pesos[w.id] : null))));
  const ws3 = XLSX.utils.aoa_to_sheet(tp);
  fmtDates(ws3, CHECKPOINTS.map((_, i) => ({ r: 1, c: i + 1 })));
  ws3['!cols'] = [{ wch:46 }].concat(CHECKPOINTS.map(() => ({ wch:11 })));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, 'Sesiones');
  XLSX.utils.book_append_sheet(wb, ws2, 'Resumen');
  XLSX.utils.book_append_sheet(wb, ws3, 'Pruebas');
  return wb;
}
async function exportXlsx(){
  if (S.exporting) return;
  S.exporting = true; render();
  try {
    let XLSX;
    try { XLSX = await loadXlsx(); }
    catch (e) { toast('No se ha podido preparar el Excel. Revisa la conexión o descarga el CSV'); return; }
    const buf = XLSX.write(buildWorkbook(XLSX), { bookType:'xlsx', type:'array', compression:true });
    await saveFile('diario-fuerza-eric.xlsx', new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    toast('Excel descargado');
  } catch (e) {
    if (!(e && e.code === 'declined')) toast('No se ha podido descargar el Excel');
  } finally { S.exporting = false; render(); }
}
async function exportCsv(){
  const cell = v => { const s = String(v == null ? '' : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['fecha', 'sesion', 'ejercicio', 'peso_kg', 'series', 'unidad', 'esfuerzo', 'nota_ejercicio', 'nota']];
  for (const s of sortedAsc()) for (const it of (s.items || [])) rows.push([s.date, s.session, it.name, mixedW(it) ? setWeights(it).map(w => w == null ? '-' : fmtNum(w)).join(' / ') : (it.weight == null ? '' : fmtNum(it.weight)), (it.sets || []).map(fmtNum).join(' / '), it.kind === 'time' ? 's' : 'reps', EFF[it.effort] || '', it.note || '', s.note || '']);
  const csv = '\ufeff' + rows.map(r => r.map(cell).join(';')).join('\r\n');
  try { await saveFile('diario-fuerza-eric.csv', csv); toast('Historial descargado'); }
  catch (e) { if (!(e && e.code === 'declined')) toast('No se ha podido descargar el archivo'); }
}


function markDone(i, s){
  const d = curDraft(), it = d.items[Number(i)];
  if (it.done[s]) { it.done[s] = false; saveDrafts(); render(); return; }
  if (isEmpty(it.reps[s])) {
    const p = prevSet(lastEntry(it.id), s);
    it.reps[s] = fmtNum(p ? p.r : it.min);
  }
  it.done[s] = true;
  if (!d.startedAt) d.startedAt = Date.now();
  saveDrafts();
  const pr = draftProgress(d);
  if (pr.done < pr.total) startRest(it.rest || S.restSec); else stopRest();
  render();
}

function onClick(act, ds){
  switch (act) {
    case 'tab': S.tab = ds.v; S.confirmDel = null; S.confirmReset = false; S.confirmPhase = null; S.confirmDiscard = false; render(); window.scrollTo(0, 0); break;
    case 'session': S.active = ds.v; S.confirmDiscard = false; render(); break;
    case 'pk-open': {
      const last = LS.get('pickFilter', {}) || {};
      S.pick = { ctx: ds.v, m: MNAME[last.m] ? last.m : null, eq: EQNAME[last.eq] ? last.eq : null, q:'' };
      openSheet(); render(); break;
    }
    case 'pk-m': case 'pk-eq': {
      const p = S.pick, f = act === 'pk-m' ? 'm' : 'eq';
      p[f] = p[f] === ds.v ? null : ds.v; p.q = '';
      if (p.ctx !== 'swap') LS.set('pickFilter', { m: p.m, eq: p.eq });
      render();
      if (act === 'pk-m' && p.m) { const r = document.getElementById('pk-results'); if (r && r.scrollIntoView) r.scrollIntoView({ block:'start', behavior:'smooth' }); }
      break;
    }
    case 'pk-add': addFromLib(ds.v); render(); break;
    case 'fx-progress': {
      while (S.fx || S.pick) closeSheet();
      S.progEx = ds.v; S.tab = 'progress'; render();
      const t = document.getElementById('prog-ex-title'); if (t) t.scrollIntoView({ block:'start' });
      break;
    }
    case 'map-days': S.mapDays = Number(ds.v); render(); break;
    case 'pk-swap': swapItem(ds.v); closeSheet(); render(); break;
    case 'it-swap': { const it = curItem(ds.i); S.pick = { ctx:'swap', i: Number(ds.i), from: it.id, m:null, eq:null, q:'' }; openSheet(); render(); break; }
    case 'it-notes': { const it = curItem(ds.i); it.notesOpen = !it.notesOpen; delete it.fixDraft; if (it.notesOpen) S.focusKey = 'dn-' + S.active + '-' + ds.i; saveDrafts(); render(); break; }
    case 'fx-open': S.fx = { id: ds.v }; openSheet(); render(); break;
    case 'fx-add':
      if (S.pick && S.pick.ctx === 'swap') { swapItem(ds.v); closeSheet(); closeSheet(); }
      else { addFromLib(ds.v); closeSheet(); }
      render(); break;
    case 'sheet-close': closeSheet(); render(); break;
    case 'clear-free': {
      const d = curDraft();
      if (!d.items.some(it => it.done.some(Boolean))) { d.items = []; saveDrafts(); S.pick = { ctx:'train', m:null, eq:null, q:'' }; openSheet(); render(); }
      break;
    }
    case 'done': markDone(ds.i, Number(ds.s)); break;
    case 'prev': {
      const it = curItem(ds.i), s = Number(ds.s), p = prevSet(lastEntry(it.id), s);
      if (p) { if (p.w != null && showWeight(it)) it.setW[s] = fmtNum(p.w); it.reps[s] = fmtNum(p.r); saveDrafts(); render(); }
      break;
    }
    case 'use': {
      const it = curItem(ds.i), w = fmtNum(Number(ds.v));
      it.weight = w; it.reps.forEach((v, s) => { if (!it.done[s]) it.setW[s] = w; });
      saveDrafts(); render(); break;
    }
    case 'set-add': { const it = curItem(ds.i); it.reps.push(''); it.setW.push(it.setW.length ? it.setW[it.setW.length - 1] : it.weight); it.done.push(false); saveDrafts(); render(); break; }
    case 'set-del': { const it = curItem(ds.i); if (it.reps.length > 1 && !it.done[it.reps.length - 1]) { it.reps.pop(); it.setW.pop(); it.done.pop(); } saveDrafts(); render(); break; }
    case 'effort': { const it = curItem(ds.i); it.effort = it.effort === ds.v ? null : ds.v; saveDrafts(); render(); break; }
    case 'skip': { const it = curItem(ds.i); it.skip = !it.skip; saveDrafts(); render(); break; }
    case 'preset': S.restSec = Number(ds.v); LS.set('restSec', S.restSec); render(); break;
    case 'rest-adj': adjustRest(Number(ds.v)); break;
    case 'rest-skip': stopRest(); break;
    case 'save': if (!S.saving) saveSession(); break;
    case 'discard':
      if (S.confirmDiscard) { S.confirmDiscard = false; S.drafts[S.active] = buildDraft(S.active); saveDrafts(); stopRest(); toast('Sesión descartada'); }
      else S.confirmDiscard = true;
      render(); break;
    case 'del': if (S.confirmDel === ds.v) { S.confirmDel = null; deleteSession(ds.v); } else { S.confirmDel = ds.v; render(); } break;
    case 'export': exportCsv(); break;
    case 'export-xlsx': exportXlsx(); break;
    case 'cp': S.cp = ds.v; render(); break;
    case 'test-save': saveTestsAction(); break;
    case 'edit-key': ensureEdit().key = ds.v; render(); break;
    case 'e-up': case 'e-down': {
      const ed = ensureEdit(), l = ed.tpl[ed.key], i = Number(ds.i), j = act === 'e-up' ? i - 1 : i + 1;
      if (j >= 0 && j < l.length) { const tmp = l[i]; l[i] = l[j]; l[j] = tmp; ed.dirty = true; }
      render(); break;
    }
    case 'e-del': { const ed = ensureEdit(); ed.tpl[ed.key].splice(Number(ds.i), 1); ed.dirty = true; render(); break; }
    case 'e-add': {
      if (S.pick) closeSheet();
      const ed = ensureEdit(), l = ed.tpl[ed.key];
      l.push({ id:'ex_' + Date.now().toString(36), name:'', kind:'reps', sets:3, min:10, max:12, weight:null, step:1, note:'' });
      ed.dirty = true; S.focusKey = 'en-' + ed.key + '-' + (l.length - 1); render(); break;
    }
    case 'e-save': if (S.edit && S.edit.dirty) saveTemplatesAction(); break;
    case 'phase-apply': { const n = Number(ds.v); if (S.confirmPhase === n) { S.confirmPhase = null; applyPhase(n); } else { S.confirmPhase = n; render(); } break; }
    case 'phase-undo': undoPhase(); break;
    case 'e-reset':
      if (S.confirmReset) { S.confirmReset = false; const ed = ensureEdit(); ed.tpl = clone(DEFAULT_TEMPLATES); ed.dirty = true; ed.resetPhases = true; toast('Plan inicial cargado. Pulsa Guardar cambios para aplicarlo'); }
      else S.confirmReset = true;
      render(); break;
    case 'backup': backupAction(); break;
    case 'auto-backup': LS.set('autoBackup', !autoBackupOn()); render(); break;
    case 'import': { const f = document.getElementById('import-file'); if (f) { f.value = ''; f.click(); } break; }
    case 'import-ok': importAction(); break;
    case 'import-cancel': S.pendingImport = null; render(); break;
  }
}
function markEditDirty(ed){
  if (ed.dirty) return;
  ed.dirty = true;
  const b = root.querySelector('[data-act="e-save"]'); if (b) { b.disabled = false; b.textContent = 'Guardar cambios'; }
}
function onField(act, ds, val){
  switch (act) {
    case 'rep': curItem(ds.i).reps[Number(ds.s)] = val; saveDraftsSoon(); break;
    case 'setw': curItem(ds.i).setW[Number(ds.s)] = val; saveDraftsSoon(); break;
    case 'date': curDraft().date = val; saveDraftsSoon(); break;
    case 'note': curDraft().note = val; saveDraftsSoon(); break;
    case 'it-dnote': curItem(ds.i).dnote = val; saveDraftsSoon(); break;
    case 'it-fixnote': curItem(ds.i).fixDraft = val; break;
    case 'fx-fixnote': if (S.fx) S.fx.noteDraft = val; break;
    case 'test': testDraft(S.cp).vals[ds.t] = val; break;
    case 'testnote': testDraft(S.cp).notes[ds.t] = val; break;
    case 'testdate': testDraft(S.cp).date = val; break;
    case 'gear': S.gearDraft[ds.v] = val; break;
    case 'pk-q': { S.pick.q = val; const r = document.getElementById('pk-results'); if (r) r.innerHTML = pickResults(); break; }
    case 'prog-ex': S.progEx = val; render(); break;
    case 'e-name': case 'e-sets': case 'e-min': case 'e-max': case 'e-step': case 'e-note': case 'e-kind': case 'e-rest': {
      const ed = ensureEdit(), e = ed.tpl[ed.key][Number(ds.i)];
      const field = { 'e-name':'name', 'e-sets':'sets', 'e-min':'min', 'e-max':'max', 'e-step':'step', 'e-note':'note', 'e-kind':'kind', 'e-rest':'rest' }[act];
      if (e) { e[field] = val; markEditDirty(ed); }
      break;
    }
    case 'e-m': case 'e-eq': {
      const ed = ensureEdit(), e = ed.tpl[ed.key][Number(ds.i)];
      if (e) { if (act === 'e-m') e.m = val ? [val] : []; else e.eq = val; markEditDirty(ed); }
      break;
    }
  }
}

document.body.addEventListener('click', e => {
  const b = e.target.closest('button[data-act], g[data-act]');
  if (!b) return;
  onClick(b.dataset.act, b.dataset);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.pick || S.fx)) { closeSheet(); render(); } });
root.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.act || el.tagName === 'SELECT' || el.type === 'file') return;
  onField(el.dataset.act, el.dataset, el.value);
});
root.addEventListener('change', e => {
  const el = e.target;
  if (!el.dataset) return;
  if (el.dataset.act === 'import-file') { if (el.files && el.files[0]) readImport(el.files[0]); return; }
  // Peso cambiado a mano: se copia a las series siguientes sin hacer
  if (el.dataset.act === 'it-fixnote') { const it = curItem(el.dataset.i); delete it.fixDraft; saveExNote(it.id, el.value); return; }
  if (el.dataset.act === 'fx-fixnote') { if (S.fx) { delete S.fx.noteDraft; saveExNote(S.fx.id, el.value); } return; }
  if (el.dataset.act === 'gear') { saveGearAction(el.dataset.v, el.value); return; }
  if (el.dataset.act === 'setw') { setSetW(curItem(el.dataset.i), Number(el.dataset.s), el.value); saveDrafts(); render(); return; }
  if (el.tagName === 'SELECT' && el.dataset.act) onField(el.dataset.act, el.dataset, el.value);
});
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (S.tab === 'progress') render(); }, 200); });
// Reloj de la sesión en curso
setInterval(() => {
  const el = document.getElementById('elapsed'), d = S.active && S.drafts[S.active];
  if (el && d && d.startedAt) el.textContent = clockText(Date.now() - d.startedAt);
}, 1000);

render();
store.init();
S.canDownload = true;
/* PWA: pedir que el navegador no borre los datos y registrar el service worker */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js')
    .then(() => navigator.serviceWorker.ready)
    .then(r => { const slow = navigator.connection && navigator.connection.saveData; if (r.active && !slow) r.active.postMessage('precache'); })
    .catch(() => {});
}
})();
